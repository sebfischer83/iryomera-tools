name: Tools CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_datasets:
        description: 'Run pinned public HPO/MAxO ontology tests (no annotation/restricted downloads)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tools:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - name: Verify generated schemas
        run: |
          python scripts/generate-schemas.py
          python scripts/generate-importer-schemas.py
          python scripts/generate-studio-schemas.py
          python scripts/generate-modkit-schemas.py
          python scripts/generate-modio-schemas.py
          python scripts/generate-diagnostic-example.py
          python scripts/generate-modkit-example.py
          git diff --exit-code -- schemas
          git diff --exit-code -- examples
      - name: Test full-dataset acquisition boundaries offline
        run: python -m unittest discover -s scripts -p "test_*.py"
      - run: dotnet restore Iryomera.Tools.sln --locked-mode
      - run: dotnet build Iryomera.Tools.sln --configuration Release --no-restore
      - name: Test both net8.0 and net10.0
        run: dotnet test Iryomera.Tools.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - run: dotnet run --project examples/Iryomera.Foundation.Sample --configuration Release --no-build
      - run: python scripts/run-importer-example.py
      - name: Exercise data-only ModKit CLI round trip
        run: python scripts/run-modkit-example.py
      - name: Exercise optional distribution entirely offline
        run: dotnet run --project examples/Iryomera.ModIo.Sample --configuration Release --no-build
      - name: Install browser test dependencies
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Test local Studio in a real bilingual offline browser session
        run: |
          dotnet publish src/Iryomera.ContentStudio --configuration Release --no-build --output artifacts/studio
          python scripts/run-studio-smoke.py --published-directory artifacts/studio
      - name: Full official ontology imports, twice each
        if: github.event_name == 'workflow_dispatch' && inputs.full_datasets
        run: python scripts/run-full-dataset-tests.py --data-dir "${{ runner.temp }}/iryomera-official" --download-open-ontologies
      - run: dotnet pack Iryomera.Tools.sln --configuration Release --no-build --output artifacts
      - name: Verify the locally packed CLI tool in isolation
        run: python scripts/run-packed-modkit-smoke.py
      - name: Test packaged net8.0 binaries inside Godot 4.7.2 .NET
        run: python scripts/run-godot-smoke.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: tools-${{ matrix.os }}
          path: |
            TestResults/*.trx
            artifacts/*.nupkg
            artifacts/full-datasets/*.json
          if-no-files-found: ignore
