name: Tools CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_datasets:
        description: 'Run pinned public HPO/MAxO ontology tests (no annotation/restricted downloads)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tools:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          # The exact SDK from global.json fixes implicit ASP.NET package versions in the lock files.
          global-json-file: global.json
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - name: Verify generated schemas
        run: |
          python scripts/generate-schemas.py
          python scripts/generate-importer-schemas.py
          python scripts/generate-studio-schemas.py
          python scripts/generate-modkit-schemas.py
          python scripts/generate-name-importer-schemas.py
          python scripts/generate-diagnostic-example.py
          python scripts/generate-modkit-example.py
          git diff --exit-code -- schemas
          git diff --exit-code -- examples
      - name: Test full-dataset acquisition boundaries offline
        run: python -m unittest discover -s scripts -p "test_*.py"
      - run: dotnet restore Iryomera.Tools.sln --locked-mode
      - run: dotnet build Iryomera.Tools.sln --configuration Release --no-restore
      - name: Test both net8.0 and net10.0
        run: dotnet test Iryomera.Tools.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - run: dotnet run --project examples/Iryomera.Foundation.Sample --configuration Release --no-build
      - run: python scripts/run-importer-example.py
      - name: Exercise data-only ModKit CLI round trip
        run: python scripts/run-modkit-example.py
      - name: Install browser test dependencies
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Test local Studio in a real bilingual offline browser session
        id: studio
        # Studio is not a published package. On release tags a Studio smoke failure is reported but does not block
        # publishing the SDK/tool packages; pull requests and branch pushes still require it.
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          dotnet publish src/Iryomera.ContentStudio --configuration Release --no-build --output artifacts/studio
          python scripts/run-studio-smoke.py --published-directory artifacts/studio --diagnostics-directory artifacts/studio-smoke
      - name: Keep Studio smoke diagnostics
        if: failure() || steps.studio.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: studio-smoke-${{ matrix.os }}
          path: artifacts/studio-smoke
          if-no-files-found: ignore
      - name: Full official ontology imports, twice each
        if: github.event_name == 'workflow_dispatch' && inputs.full_datasets
        run: python scripts/run-full-dataset-tests.py --data-dir "${{ runner.temp }}/iryomera-official" --download-open-ontologies
      - run: dotnet pack Iryomera.Tools.sln --configuration Release --no-build --output artifacts
      - name: Test packaged net8.0 binaries inside Godot 4.7.2 .NET
        run: python scripts/run-godot-smoke.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: tools-${{ matrix.os }}
          path: |
            TestResults/*.trx
            artifacts/*.nupkg
            artifacts/full-datasets/*.json
          if-no-files-found: ignore

  # Releases only: a v* tag publishes exactly the packages the Ubuntu job built and tested, after both OS jobs pass.
  publish:
    needs: tools
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tools-ubuntu-latest
          path: release
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Require exactly the five packages at the tag version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The artifact keeps paths relative to the common ancestor of its files; locate packages by name.
          find release -name '*.nupkg' | sort > packages.txt
          for id in Iryomera.Content.SDK Iryomera.Localization Iryomera.MedicalImporter Iryomera.ModKit Iryomera.NameImporter; do
            grep -q "/$id\.$version\.nupkg$" packages.txt || { echo "::error::Missing $id.$version.nupkg; <Version> in Directory.Build.props must match tag $GITHUB_REF_NAME."; exit 1; }
          done
          test "$(wc -l < packages.txt)" -eq 5 || { echo "::error::Expected exactly 5 packages."; cat packages.txt; exit 1; }
      - name: Push to GitHub Packages
        run: |
          while read -r package; do
            dotnet nuget push "$package" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
          done < packages.txt
