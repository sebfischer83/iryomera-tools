name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify generated schemas
        run: |
          python scripts/generate-schemas.py
          git diff --exit-code -- schemas
      - run: dotnet restore Iryomera.Tools.sln --locked-mode
      - run: dotnet build Iryomera.Tools.sln --configuration Release --no-restore
      - run: dotnet test Iryomera.Tools.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - run: dotnet run --project examples/Iryomera.Foundation.Sample --configuration Release --no-build
      - run: dotnet pack Iryomera.Tools.sln --configuration Release --no-build --output artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-${{ matrix.os }}
          path: |
            TestResults/*.trx
            artifacts/*.nupkg
          if-no-files-found: ignore
